<header class="site-header">
  <div class="container header-inner">

    <a
      class="school-brand"
      href="index.html"
      aria-label="गृहपृष्ठ"
    >
      <div class="header-logo-wrap">
        <img
          id="headerLogo"
          class="header-logo"
          src=""
          alt=""
        >
      </div>

      <div class="header-school-info">
        <h1
          id="headerSchoolNameNp"
          class="header-school-name"
        ></h1>

        <p
          id="headerSchoolNameEn"
          class="header-school-name-en"
        ></p>

        <p
          id="headerEstablished"
          class="header-established"
        ></p>
      </div>
    </a>

    <div class="header-actions">

      <a
        id="headerCallButton"
        class="header-action header-call"
        href="#"
        hidden
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M6.6 10.8a15.6 15.6 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.1.37 2.27.57 3.46.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.55 21 3 13.45 3 4.14a1 1 0 0 1 1-1H7.5a1 1 0 0 1 1 1c0 1.19.2 2.36.57 3.46a1 1 0 0 1-.25 1.02L6.6 10.8Z"
          />
        </svg>

        <span>
          <small>सम्पर्क</small>
          <strong id="headerPhoneText"></strong>
        </span>
      </a>

      <a
        id="headerDownloadButton"
        class="btn btn-primary header-download"
        href="#"
        hidden
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"
          />
        </svg>

        <span>प्रोस्पेक्टस</span>
      </a>

    </div>

  </div>
</header>
