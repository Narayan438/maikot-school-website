<div class="topbar">
  <div class="container topbar-inner">

    <div class="topbar-contact">

      <a
        id="topbarPhone"
        class="topbar-item"
        href="#"
        hidden
      >
        <span aria-hidden="true">☎</span>
        <span id="topbarPhoneText"></span>
      </a>

      <a
        id="topbarEmail"
        class="topbar-item"
        href="#"
        hidden
      >
        <span aria-hidden="true">✉</span>
        <span id="topbarEmailText"></span>
      </a>

      <span class="topbar-item">
        <span aria-hidden="true">📍</span>
        <span id="topbarAddress"></span>
      </span>

    </div>

    <div class="topbar-social">

      <a
        id="topbarFacebook"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
        hidden
      >
        Facebook
      </a>

      <a
        id="topbarYouTube"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        hidden
      >
        YouTube
      </a>

      <a
        id="topbarTikTok"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
        hidden
      >
        TikTok
      </a>

    </div>

  </div>
</div>
